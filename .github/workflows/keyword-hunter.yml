name: Swiggy Instamart Keyword Deal Hunter

on:
  schedule:
    # Run every hour at 17 minutes past (UTC)
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      skip_sync:
        description: 'Skip top-of-hour wait sync (run immediately)'
        type: boolean
        required: false
        default: false

# A single shared cache must never be updated by overlapping workflow runs.
concurrency:
  group: instamart-deal-hunter
  cancel-in-progress: false

jobs:
  hunt:
    name: Unified Deal Hunter
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'swiggy-telegram-bot/package-lock.json'

      - name: Install Dependencies
        working-directory: swiggy-telegram-bot
        run: npm ci || npm install

      # Import each previous campaign cache once. These are restored into the
      # same data directory so dealTracker can merge their product histories.
      - name: Restore legacy fresh cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: legacy-fresh-${{ github.run_id }}
          restore-keys: |
            deal-cache-fresh-

      - name: Restore legacy grocery cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: legacy-grocery-${{ github.run_id }}
          restore-keys: |
            deal-cache-grocery-

      - name: Restore legacy treats cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: legacy-treats-${{ github.run_id }}
          restore-keys: |
            deal-cache-treats-

      - name: Restore legacy munchies cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: legacy-munchies-${{ github.run_id }}
          restore-keys: |
            deal-cache-munchies-

      - name: Restore legacy beverages cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: legacy-beverages-${{ github.run_id }}
          restore-keys: |
            deal-cache-beverages-

      - name: Restore legacy personal cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: legacy-personal-${{ github.run_id }}
          restore-keys: |
            deal-cache-personal-

      - name: Restore legacy lifestyle cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: legacy-lifestyle-${{ github.run_id }}
          restore-keys: |
            deal-cache-lifestyle-

      - name: Restore legacy household cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: legacy-household-${{ github.run_id }}
          restore-keys: |
            deal-cache-household-

      - name: Restore legacy clearance cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: legacy-clearance-${{ github.run_id }}
          restore-keys: |
            deal-cache-clearance-

      - name: Restore legacy discovered cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: legacy-discovered-${{ github.run_id }}
          restore-keys: |
            deal-cache-discovered-

      - name: Restore shared deal cache
        uses: actions/cache/restore@v4
        with:
          path: swiggy-telegram-bot/data
          key: deal-cache-global-${{ github.run_id }}
          restore-keys: |
            deal-cache-global-

      - name: Run all campaigns with shared deduplication
        working-directory: swiggy-telegram-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SWIGGY_STORE_ID: ${{ secrets.SWIGGY_STORE_ID }}
          SWIGGY_PRIMARY_STORE_ID: ${{ secrets.SWIGGY_PRIMARY_STORE_ID }}
          SWIGGY_SECONDARY_STORE_ID: ${{ secrets.SWIGGY_SECONDARY_STORE_ID }}
          SWIGGY_COOKIE: ${{ secrets.SWIGGY_COOKIE }}
          FRESH_MIN_DISCOUNT: ${{ secrets.FRESH_MIN_DISCOUNT || secrets.ESSENTIALS_MIN_DISCOUNT }}
          GROCERY_MIN_DISCOUNT: ${{ secrets.GROCERY_MIN_DISCOUNT || secrets.ESSENTIALS_MIN_DISCOUNT }}
          ESSENTIALS_MIN_DISCOUNT: ${{ secrets.ESSENTIALS_MIN_DISCOUNT }}
          TREATS_MIN_DISCOUNT: ${{ secrets.TREATS_MIN_DISCOUNT }}
          MUNCHIES_MIN_DISCOUNT: ${{ secrets.MUNCHIES_MIN_DISCOUNT || secrets.TREATS_MIN_DISCOUNT }}
          LIFESTYLE_MIN_DISCOUNT: ${{ secrets.LIFESTYLE_MIN_DISCOUNT }}
          BEVERAGES_MIN_DISCOUNT: ${{ secrets.BEVERAGES_MIN_DISCOUNT }}
          PERSONAL_MIN_DISCOUNT: ${{ secrets.PERSONAL_MIN_DISCOUNT }}
          HOUSEHOLD_MIN_DISCOUNT: ${{ secrets.HOUSEHOLD_MIN_DISCOUNT }}
          CLEARANCE_MIN_DISCOUNT: ${{ secrets.CLEARANCE_MIN_DISCOUNT }}
          USE_BROWSER: 'true'
          SKIP_SYNC: ${{ inputs.skip_sync }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          EXTRA_FLAGS=""
          if [ "$SKIP_SYNC" = "true" ]; then
            EXTRA_FLAGS="--skip-sync"
          fi
          echo "Executing all deal-hunter campaigns in one shared-cache process..."
          node src/cron-runner.js auto $EXTRA_FLAGS

      - name: Save shared deal cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: swiggy-telegram-bot/data
          key: deal-cache-global-${{ github.run_id }}
